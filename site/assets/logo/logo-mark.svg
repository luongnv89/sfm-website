    <path d="M32 32L15.03 15.03A24 24 0 0 1 48.97 15.03Z" fill="#4d9fff" fill-opacity="0.26"/>
    <path d="M20 32a12 12 0 1 0 24 0a12 12 0 1 0 -24 0Z" fill="none" stroke="#5b6f8f" stroke-width="2"/>
  </g>
