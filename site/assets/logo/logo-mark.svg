<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="sfm">
  <title>sfm</title>
  <!-- Layer 2 (middle detail): the swept sector and the range ring; dropped in favicon.svg -->
